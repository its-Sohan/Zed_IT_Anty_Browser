name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ensure Electron shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libgtk-3-0t64 libgbm1 libasound2t64 || \
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace typecheck
        run: pnpm typecheck

      - name: Run unit & integration tests
        run: pnpm test

  build-linux:
    name: Build Linux (x86_64 AppImage)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils unzip file desktop-file-utils

      - name: Cache Linux Chromium engine & Electron runtime
        uses: actions/cache@v6
        with:
          path: |
            resources/engines
            .cache
          key: zita-linux-x64-${{ hashFiles('resources/engines/manifest.json', 'apps/desktop/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            zita-linux-x64-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned Linux Chromium engine
        run: pnpm engine:fetch -- --platform=linux-x64

      - name: Build Linux AppImage
        env:
          ZITA_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: pnpm build:linux

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: zita-linux-x64-appimage
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows (amd64 NSIS .exe)
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ensure NSIS (makensis)
        shell: pwsh
        run: |
          $nsisCandidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          )
          $found = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $found) {
            foreach ($candidate in $nsisCandidates) {
              if (Test-Path $candidate) {
                Split-Path -Parent $candidate | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                $found = $true
                break
              }
            }
          }
          if (-not $found) {
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Cache Windows Chromium engine & Electron runtime
        uses: actions/cache@v6
        with:
          path: |
            resources/engines
            .cache
          key: zita-win-x64-${{ hashFiles('resources/engines/manifest.json', 'apps/desktop/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            zita-win-x64-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned Windows Chromium engine
        run: pnpm engine:fetch -- --platform=win-x64

      - name: Build Windows NSIS installer (.exe)
        env:
          ZITA_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          ZITA_NSIS_FAST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: pnpm build:win

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: zita-windows-amd64-exe
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Assemble & verify SHA256SUMS.txt
        working-directory: release-assets
        run: |
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Zed IT Anti Browser ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.exe.sha256
            release-assets/*.AppImage
            release-assets/*.AppImage.sha256
            release-assets/SHA256SUMS.txt
